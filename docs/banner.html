<!doctype html>
<!-- README banners. Render with docs/render-banners.sh; ?lang=en|uk -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Manrope"; src: url(manrope-latin.woff2) format("woff2"); font-weight: 400 800; unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: "Manrope"; src: url(manrope-cyrillic.woff2) format("woff2"); font-weight: 400 800; unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 560px; overflow: hidden; }
  body { font-family: "Manrope", system-ui, sans-serif; color: #161b3d; background: #ece9fa; position: relative;
         display: flex; align-items: center; gap: 70px; padding: 0 120px; }
  body::before, body::after { content: ""; position: absolute; border-radius: 50%; background: #e1dcf7; }
  body::before { width: 760px; height: 760px; right: -180px; top: -330px; }
  body::after { width: 520px; height: 520px; left: -170px; bottom: -330px; }
  img { position: relative; width: 300px; height: 300px; filter: drop-shadow(0 24px 40px rgba(40, 36, 100, .25)); }
  .copy { position: relative; }
  .name { font-size: 104px; font-weight: 800; letter-spacing: -.035em; line-height: 1; }
  .name span { color: #555c7d; font-weight: 700; }
  .tag { margin-top: 30px; font-size: 38px; font-weight: 600; color: #2a2f57; line-height: 1.3; }
</style>
</head>
<body>
<img src="../images/icon.png" alt="">
<div class="copy">
  <div class="name">Dropyk <span id="for"></span></div>
  <p class="tag" id="tag"></p>
</div>
<script>
  const uk = new URLSearchParams(location.search).get('lang') === 'uk';
  document.getElementById('for').textContent = uk ? 'для Mac' : 'for Mac';
  // Broken by hand so the second line never ends up a single word.
  document.getElementById('tag').innerHTML = uk
    ? 'Файли з Android-телефона на Mac<br>через Quick Share.' : 'Files from your Android phone to the Mac<br>with Quick Share.';
</script>
</body>
</html>
